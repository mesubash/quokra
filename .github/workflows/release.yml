# For a version tag (v2.1.0): checks that the server's version matches, then publishes the Docker image as
# ghcr.io/<owner>/quokra:2.1.0, :2.1 and :latest. Create the GitHub Release from the changelog yourself.
# For a tag made before this workflow (or to rebuild one): Actions → Release → Run workflow, with the tag.
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to publish, e.g. v2.0.0
        required: true

env:
  TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      - name: Tag matches server/pom.xml
        run: |
          version="$(sed -n 's|^\t<version>\(.*\)</version>|\1|p' server/pom.xml | head -1)"
          if [ "v$version" != "$TAG" ]; then
            echo "Tag $TAG doesn't match server/pom.xml version $version" >&2
            exit 1
          fi

      # Rebuilding an older version must not move :latest.
      - id: newest
        name: Is this the newest version?
        run: |
          newest="$(git ls-remote --tags --refs origin 'v*.*.*' | sed 's|.*refs/tags/||' | sort -V | tail -1)"
          echo "latest=$([ "$TAG" = "$newest" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/quokra
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
            type=raw,value=latest,enable=${{ steps.newest.outputs.latest }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
