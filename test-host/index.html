<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Test host: bubble</title>
    <style>body { font-family: system-ui, sans-serif; margin: 24px; max-width: 640px; }</style>
  </head>
  <body>
    <h1>Test host (different origin)</h1>
    <p>Bubble mode: the chat button is in the bottom-right corner.</p>
    <p>Other modes: <a href="inline.html">inline</a> · <a href="popup.html">popup</a> · <a href="console.html">agent console</a> · <a href="identify.html">identify</a></p>
    <p id="unread"></p>

    <script src="http://localhost:8080/sdk.js" data-quokra-chat="demo" data-quokra-pk="pk_test_demo"></script>
    <script>
      Quokra.chat.on("unread", (n) => {
        document.getElementById("unread").textContent = n ? `Unread: ${n}` : "";
      });
    </script>
  </body>
</html>
