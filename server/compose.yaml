# Local development services. Started automatically by spring-boot-docker-compose
# when running the server from this directory.
services:
  postgres:
    image: 'postgres:17-alpine'
    environment:
      - 'POSTGRES_DB=quokra'
      - 'POSTGRES_USER=quokra'
      - 'POSTGRES_PASSWORD=quokra'
    ports:
      - '5432'

  # A real identity provider for agent logins, with the dev realm from keycloak/quokra-realm.json:
  # agents sam/sam (also QUOKRA_ADMIN) and alex/alex (SUPPORT_AGENT), riley/riley (no role).
  # Keycloak's own admin console: admin/admin. After changing the realm file, recreate the container
  # (docker compose rm -sf keycloak) so it's imported again.
  # Dev only: these passwords are public.
  keycloak:
    image: 'keycloak/keycloak:26.0'
    command: ['start-dev', '--import-realm']
    environment:
      - 'KC_BOOTSTRAP_ADMIN_USERNAME=admin'
      - 'KC_BOOTSTRAP_ADMIN_PASSWORD=admin'
    ports:
      - '8180:8080'
    volumes:
      - './keycloak:/opt/keycloak/data/import:ro'
