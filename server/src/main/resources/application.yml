spring:
  application:
    name: quokra-server
  servlet:
    multipart:
      # Images up to 5 MB (checked again when stored).
      max-file-size: 5MB
      max-request-size: 6MB
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration

quokra:
  bots:
    # Folder with extra bot files; files here replace built-in ones with the same name.
    dir: ${QUOKRA_BOTS_DIR:}
  agents:
    # Identity provider that issues agent access tokens (leave empty to turn agent login off).
    issuer-uri: ${OIDC_ISSUER_URI:}
    # Only if the provider has no discovery document (/.well-known/openid-configuration): its JWKS URL.
    jwks-uri: ${OIDC_JWKS_URI:}
    # Claim with the agent's display name, if not name / preferred_username / email.
    name-claim: ${QUOKRA_AGENT_NAME_CLAIM:}
    audience: ${OIDC_AUDIENCE:quokra-api}
    # Where the roles are in the token, e.g. "roles" or "realm_access.roles".
    roles-claim: ${QUOKRA_AGENT_ROLES_CLAIM:roles}
    role: ${QUOKRA_AGENT_ROLE:SUPPORT_AGENT}
  admins:
    # People with this role (in the same roles claim) manage companies, keys, sites and agents.
    role: ${QUOKRA_ADMIN_ROLE:QUOKRA_ADMIN}
  tenant-secrets:
    # 32 random bytes, base64. Encrypts tenant secret keys in the database. Empty: identify is off.
    encryption-key: ${TENANT_SECRET_ENCRYPTION_KEY:}
  attachments:
    # disk (a folder, e.g. a Docker volume) or s3 (AWS S3, Cloudflare R2, MinIO).
    store: ${QUOKRA_ATTACHMENTS_STORE:disk}
    dir: ${QUOKRA_ATTACHMENTS_DIR:./data/attachments}
    s3:
      bucket: ${QUOKRA_ATTACHMENTS_S3_BUCKET:}
      region: ${QUOKRA_ATTACHMENTS_S3_REGION:us-east-1}
      # Only for R2 or MinIO, e.g. https://<account>.r2.cloudflarestorage.com
      endpoint: ${QUOKRA_ATTACHMENTS_S3_ENDPOINT:}
  ws:
    # Origins allowed to open the WebSocket: where the chat panel and console are served.
    allowed-origins: ${PUBLIC_BASE_URL:http://localhost:8080}

server:
  # Trust X-Forwarded-For only from proxies on private networks (Tomcat's default), so rate limits see the real client.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:native}
  compression:
    # sdk.js, the web UI and the robot image compress well.
    enabled: true
    mime-types: text/html,text/css,text/javascript,application/javascript,application/json,image/svg+xml
    min-response-size: 1KB

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
