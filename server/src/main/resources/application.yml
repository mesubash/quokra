spring:
  application:
    name: quokra-server
  servlet:
    multipart:
      # Images up to 5 MB (checked again when stored).
      max-file-size: 5MB
      max-request-size: 6MB
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  mail:
    # Email is off until SMTP_HOST and QUOKRA_MAIL_FROM are set (see MailCheck).
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:true}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000

quokra:
  bots:
    # Folder with extra bot files; files here replace built-in ones with the same name.
    dir: ${QUOKRA_BOTS_DIR:}
  agents:
    # Identity provider that issues agent access tokens (leave empty to turn agent login off).
    issuer-uri: ${OIDC_ISSUER_URI:}
    # Only if the provider has no discovery document (/.well-known/openid-configuration): its JWKS URL.
    jwks-uri: ${OIDC_JWKS_URI:}
    # Claim with the agent's display name, if not name / preferred_username / email.
    name-claim: ${QUOKRA_AGENT_NAME_CLAIM:}
    audience: ${OIDC_AUDIENCE:quokra-api}
    # Where the roles are in the token, e.g. "roles" or "realm_access.roles".
    roles-claim: ${QUOKRA_AGENT_ROLES_CLAIM:roles}
    role: ${QUOKRA_AGENT_ROLE:SUPPORT_AGENT}
  admins:
    # Server admins: people with this role (in the same roles claim) manage every company and create new ones.
    role: ${QUOKRA_ADMIN_ROLE:QUOKRA_ADMIN}
    # Company admins can also come from the token: a claim (dotted path, e.g. "permissions" or "scope") whose
    # values look like company-value, with {tenant} the company's slug. Empty: only the Admin switch in Settings.
    company-claim: ${QUOKRA_COMPANY_ADMIN_CLAIM:}
    company-value: ${QUOKRA_COMPANY_ADMIN_VALUE:quokra:{tenant}:admin}
  tenant-secrets:
    # 32 random bytes, base64. Encrypts tenant secret keys in the database. Empty: identify is off.
    encryption-key: ${TENANT_SECRET_ENCRYPTION_KEY:}
  attachments:
    # disk (a folder, e.g. a Docker volume) or s3 (AWS S3, Cloudflare R2, MinIO).
    store: ${QUOKRA_ATTACHMENTS_STORE:disk}
    dir: ${QUOKRA_ATTACHMENTS_DIR:./data/attachments}
    s3:
      bucket: ${QUOKRA_ATTACHMENTS_S3_BUCKET:}
      region: ${QUOKRA_ATTACHMENTS_S3_REGION:us-east-1}
      # Only for R2 or MinIO, e.g. https://<account>.r2.cloudflarestorage.com
      endpoint: ${QUOKRA_ATTACHMENTS_S3_ENDPOINT:}
  retention:
    # What companies may choose for keeping resolved chats (Settings → General), in months.
    # max-months 0 allows "forever"; otherwise nothing is kept longer than max-months.
    min-months: ${QUOKRA_RETENTION_MIN_MONTHS:1}
    max-months: ${QUOKRA_RETENTION_MAX_MONTHS:60}
    # When old chats are deleted (server time).
    cron: ${QUOKRA_RETENTION_CRON:0 0 3 * * *}
  mail:
    # The sender of Quokra's emails, e.g. "Support <support@example.com>".
    from: ${QUOKRA_MAIL_FROM:}
  ws:
    # Origins allowed to open the WebSocket: where the chat panel and console are served.
    allowed-origins: ${PUBLIC_BASE_URL:http://localhost:8080}

server:
  # Trust X-Forwarded-For only from proxies on private networks (Tomcat's default), so rate limits see the real client.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:native}
  compression:
    # sdk.js, the web UI and the robot image compress well.
    enabled: true
    mime-types: text/html,text/css,text/javascript,application/javascript,application/json,image/svg+xml
    min-response-size: 1KB

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
  health:
    # Our own check is "email": not configured is fine, configured but unreachable is not.
    mail:
      enabled: false
